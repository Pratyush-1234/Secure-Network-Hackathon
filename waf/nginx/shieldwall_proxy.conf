# Common proxy settings for every location that forwards to the legacy app.
# Plain include, not envsubst'ed.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header Connection        "";
proxy_set_header Proxy             "";
# Overwrite instead of append, so a client cannot spoof its source address to the app
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-ID      $request_id;
proxy_redirect     off;
proxy_connect_timeout 5s;
proxy_read_timeout    30s;
proxy_hide_header  X-Powered-By;
proxy_pass http://dvwa_backend;
# Edge hardening of the legacy app's session cookies (it sets them without flags):
# Secure (HTTPS only), HttpOnly (stops XSS cookie theft), SameSite=Lax (CSRF)
proxy_cookie_flags ~ secure httponly samesite=lax;
