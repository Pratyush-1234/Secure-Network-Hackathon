# =====================================================================
# Shield Wall: CRS tuning and rule exclusions applied BEFORE the CRS rules
# Rule-id range 1000-1099 (CRS reserves 1-99,999 for local use).
#
# Policy: never switch a CRS rule off globally. Every exclusion is
#   * scoped to one URI (REQUEST_FILENAME) and, where possible, one parameter
#   * documented in docs/tuning-notes.md with the false positive that caused it
# =====================================================================

# Block only the HTTP methods the legacy app actually uses
SecAction \
    "id:1000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_methods=GET HEAD POST'"

# ---------------------------------------------------------------------
# FP-1  /instructions.php renders DVWA's README/CHANGELOG. The documentation
#       quotes MySQL/PHP error strings ("ERROR 1045 (28000)", "Fatal error:",
#       "fopen", "Cannot modify header information"), so the CRS response-leakage
#       rules fire on every view (outbound score 18 > 4). This is a static
#       documentation page: no user input reaches a SQL or PHP sink here.
#       Scope: this one URI, these four response rules. All inbound rules stay
#       active, and leakage detection stays active on every other page.
# ---------------------------------------------------------------------
SecRule REQUEST_FILENAME "@streq /instructions.php" \
    "id:1010,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveById=951230,\
    ctl:ruleRemoveById=951250,\
    ctl:ruleRemoveById=953100,\
    ctl:ruleRemoveById=953110"

# ---------------------------------------------------------------------
# FP-2  Guestbook free-text message (POST /vulnerabilities/xss_s/, ARGS:mtxMessage)
#       At PL2, ordinary prose triggers SQLi/RCE heuristics:
#         942200  "Great site, thanks! I'll be back at 5 o'clock."   (quote + comma)
#         942440  "Can't wait -- see you @ 5pm; ..."                  ("--" comment)
#         932200  same message                                         (quote/semicolon)
#       The field is natural language by design. Fix: remove ONLY these three rule
#       IDs and ONLY for this one parameter on this one URI. All XSS rules (941xxx),
#       libinjection SQLi (942100) and every other rule still inspect mtxMessage,
#       so the stored-XSS attack in attack.sh is still blocked.
# ---------------------------------------------------------------------
SecRule REQUEST_FILENAME "@streq /vulnerabilities/xss_s/" \
    "id:1020,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveTargetById=942200;ARGS:mtxMessage,\
    ctl:ruleRemoveTargetById=942440;ARGS:mtxMessage,\
    ctl:ruleRemoveTargetById=932200;ARGS:mtxMessage"
