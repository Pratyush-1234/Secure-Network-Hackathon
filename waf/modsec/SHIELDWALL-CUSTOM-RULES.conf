# =====================================================================
# Shield Wall custom rules (rule-id range 10000-10999)
# ModSecurity ID registry: 1-99,999 is reserved for local rules; CRS uses 900,000-999,999;
# our exclusions use 1000-1099 and 1100-1199. So 10000-10999 collides with neither.
# Loaded AFTER the OWASP CRS rule files (see setup.conf.template).
#
# CRS's blocking-evaluation rule (949110) runs earlier in phase 2.
# So these rules see a request only if CRS has not already blocked it.
# They are a second, positive-security layer: virtual patches that
# describe what a valid parameter looks like. Anything else is denied,
# whatever the payload encoding or obfuscation.
#
# NOTE: libmodsecurity v3 compiles every @rx with PCRE2_MULTILINE | PCRE2_DOTALL.
# So '^' and '$' match at EVERY line break, and "127.0.0.1%0aid" would satisfy
# ^...$ on its first line. Allow-lists must therefore anchor with \A and \z.
# (Found during testing: the newline payload bypassed a first ^...$ version.)
# =====================================================================

# ---------------------------------------------------------------------
# 10100  VIRTUAL PATCH: OS command injection in /vulnerabilities/exec/
#         CWE-78 / CAPEC-88. The legacy code passes $_REQUEST['ip'] straight
#         to shell_exec("ping -c 4 " . $target). The only legitimate value is
#         an IPv4 address or a DNS hostname.
# ---------------------------------------------------------------------
SecRule REQUEST_FILENAME "@beginsWith /vulnerabilities/exec/" \
    "id:10100,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,t:urlDecodeUni,t:normalizePath,\
    msg:'Shield Wall virtual patch: command injection in exec/ (ip must be an IPv4 address or hostname)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-rce',\
    tag:'shieldwall/virtual-patch',\
    tag:'capec/1000/152/248/88',\
    tag:'attack/T1190',\
    ver:'shieldwall/1.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:ip "!@rx \A(?:(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])|(?=[A-Za-z0-9.-]{1,253}\z)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)*[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)\z" \
        "t:none"

# ---------------------------------------------------------------------
# 10110  VIRTUAL PATCH: SQL injection in /vulnerabilities/sqli/ and sqli_blind/
#         CWE-89 / CAPEC-66. 'id' is concatenated into a SQL string.
#         A user ID is only ever a small positive integer.
# ---------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/vulnerabilities/sqli(?:_blind)?/" \
    "id:10110,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,t:urlDecodeUni,t:normalizePath,\
    msg:'Shield Wall virtual patch: SQL injection in sqli/ (id must be numeric)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-sqli',\
    tag:'shieldwall/virtual-patch',\
    tag:'capec/1000/152/248/66',\
    tag:'attack/T1190',\
    ver:'shieldwall/1.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:id|REQUEST_COOKIES:id "!@rx \A[0-9]{1,6}\z" \
        "t:none"

# ---------------------------------------------------------------------
# 10120  VIRTUAL PATCH: path traversal / file inclusion in /vulnerabilities/fi/
#         CWE-22 / CAPEC-126 (and CWE-98 RFI). 'page' is passed to include().
#         Only the four shipped pages are valid (allow-list).
# ---------------------------------------------------------------------
SecRule REQUEST_FILENAME "@beginsWith /vulnerabilities/fi/" \
    "id:10120,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,t:urlDecodeUni,t:normalizePath,\
    msg:'Shield Wall virtual patch: file inclusion / path traversal in fi/ (page not on allow-list)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-lfi',\
    tag:'shieldwall/virtual-patch',\
    tag:'capec/1000/255/153/126',\
    tag:'attack/T1190',\
    ver:'shieldwall/1.0',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:page "!@rx \A(?:include|file[1-4])\.php\z" \
        "t:none"

# ---------------------------------------------------------------------
# 10200  Scanner / attack-tool user agents (backstop for CRS 913100)
#         T1595.002 Vulnerability Scanning, T1110 (hydra/medusa)
# ---------------------------------------------------------------------
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:sqlmap|nikto|nmap|masscan|zgrab|hydra|medusa|ffuf|fuzz faster u fool|gobuster|dirbuster|dirb|feroxbuster|wfuzz|nuclei|wpscan|acunetix|nessus|openvas|netsparker|arachni|w3af|skipfish|whatweb|commix|havij|zap/)" \
    "id:10200,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'Shield Wall: attack tool / vulnerability scanner user agent',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-reputation-scanner',\
    tag:'shieldwall/scanner',\
    tag:'capec/1000/118/224/541/310',\
    tag:'attack/T1595.002',\
    ver:'shieldwall/1.0',\
    severity:'CRITICAL'"
