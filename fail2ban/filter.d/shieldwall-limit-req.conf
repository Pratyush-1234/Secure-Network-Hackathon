# Matches nginx limit_req rejections in the login/brute zones, e.g.
# 2026/11/21 04:30:00 [error] 25#25: *12 limiting requests, excess: 3.940 by zone "login", client: 172.30.0.66, server: ...
[Definition]
failregex = ^\s*\[error\] \d+#\d+: \*\d+ limiting requests, excess: \S+ by zone "(?:login|brute)", client: <HOST>,
ignoreregex =
datepattern = ^%%Y/%%m/%%d %%H:%%M:%%S
