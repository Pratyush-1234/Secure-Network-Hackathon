# Matches ModSecurity REQUEST-phase (1/2) interventions written to the nginx error log.
# Phase 3/4 (response) events are ignored: on nginx they cannot stop a response that
# has already started streaming, and they are not caused by the client's input. Example:
# 2026/11/21 04:13:36 [error] 594#594: *7 [client 10.66.10.66] ModSecurity: Access denied with code 403 (phase 2). ...
[Definition]
failregex = ^\s*\[error\] \d+#\d+: \*\d+ \[client <HOST>\] ModSecurity: Access denied with code 403 \(phase [12]\)
ignoreregex =
datepattern = ^%%Y/%%m/%%d %%H:%%M:%%S
